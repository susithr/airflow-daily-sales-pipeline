services:
  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - airflow_home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data:ro

  sales-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD}
      POSTGRES_DB: sales
    volumes:
      - sales_data:/var/lib/postgresql/data

volumes:
  airflow_home:
  sales_data: